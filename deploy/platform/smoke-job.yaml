apiVersion: batch/v1
kind: Job
metadata:
  name: agentbox-smoke-__RUN_ID__
  namespace: agentbox-platform
  labels:
    app.kubernetes.io/managed-by: agentbox-platform
    agentbox.dev/session: __SESSION__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: agentbox-platform
        agentbox.dev/session: __SESSION__
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      nodeSelector:
        agentbox.dev/lab: agentbox-platform-lab
        agentbox.dev/role: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compute
          image: __SMOKE_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/python3
            - -I
            - -B
            - -c
            - "import json; print(json.dumps({'result': sum(i*i for i in range(1, 1001))}, sort_keys=True))"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
