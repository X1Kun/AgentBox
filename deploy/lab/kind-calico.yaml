kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
# The functional lab also runs on shared disks. kubeadm's default 1m API
# bootstrap request budget can expire before cold control-plane images start.
# This remains bounded and does not change any workload/SLO deadline.
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: InitConfiguration
    timeouts:
      kubernetesAPICall: 4m
nodes:
  - role: control-plane
  - role: worker
    labels:
      agentbox.dev/lab: agentbox-platform-lab
      agentbox.dev/role: worker
