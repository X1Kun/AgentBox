apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- rbac.yaml
- check.yaml
- deployment.yaml
- networkpolicy.yaml
configMapGenerator:
- name: agentbox-health-policy
  namespace: agentbox-admission
  files:
  - policy.yaml=policy.example.yaml
generatorOptions:
  disableNameSuffixHash: true
