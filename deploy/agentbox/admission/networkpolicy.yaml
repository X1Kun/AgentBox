apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentbox-admission
  namespace: agentbox-admission
spec:
  podSelector:
    matchLabels:
      app: agentbox-admission
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agentbox-observability
    ports:
    - {protocol: TCP, port: 9091}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
# API and Prometheus endpoint egress is added by render_admission.py.
