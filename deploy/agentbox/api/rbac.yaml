apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox-api
  namespace: agentbox-client
  labels:
    agentbox.dev/session: development
    agentbox.dev/session-run: preview
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentbox-api
  namespace: agentbox-work
  labels:
    agentbox.dev/session: development
    agentbox.dev/session-run: preview
rules:
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxclaims
  verbs:
  - create
  - get
  - patch
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxwarmpools
  verbs:
  - get
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  - services
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentbox-api
  namespace: agentbox-work
  labels:
    agentbox.dev/session: development
    agentbox.dev/session-run: preview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentbox-api
subjects:
- kind: ServiceAccount
  name: agentbox-api
  namespace: agentbox-client
