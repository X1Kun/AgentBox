apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: batch-api
  namespace: agentbox-batch
  labels:
    agentbox.dev/session: development
    agentbox.dev/batch-run: preview
spec:
  podSelector:
    matchLabels:
      agentbox.dev/batch-role: api
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
