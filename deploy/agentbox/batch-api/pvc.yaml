apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: batch-artifacts
  namespace: agentbox-batch
  labels:
    agentbox.dev/session: development
    agentbox.dev/batch-run: preview
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
