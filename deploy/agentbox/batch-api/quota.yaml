apiVersion: v1
kind: ResourceQuota
metadata:
  name: batch-product-budget
  namespace: agentbox-batch
  labels:
    agentbox.dev/session: development
    agentbox.dev/batch-run: preview
spec:
  hard:
    pods: '2'
    requests.cpu: 600m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 768Mi
    persistentvolumeclaims: '1'
    requests.storage: 1Gi
    count/jobs.batch: '8'
    count/workloads.kueue.x-k8s.io: '8'
