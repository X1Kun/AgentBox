apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-api
  namespace: agentbox-batch
  labels:
    agentbox.dev/session: development
    agentbox.dev/batch-run: preview
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: batch-api
  namespace: agentbox-batch
  labels:
    agentbox.dev/session: development
    agentbox.dev/batch-run: preview
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, patch, delete]
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list]
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  resourceNames: [batch-artifacts]
  verbs: [get]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list]
- apiGroups: [kueue.x-k8s.io]
  resources: [localqueues]
  resourceNames: [batch]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: batch-api
  namespace: agentbox-batch
  labels:
    agentbox.dev/session: development
    agentbox.dev/batch-run: preview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: batch-api
subjects:
- kind: ServiceAccount
  name: batch-api
  namespace: agentbox-batch
