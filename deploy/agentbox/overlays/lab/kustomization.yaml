apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../api
- ../../cleanup
- ../../../components/agent-sandbox
- ../../batch
- batch-quota.yaml
- quota.yaml
patches:
- target:
    kind: Deployment
    name: agentbox-api
  path: api-patch.yaml
- target:
    kind: SandboxTemplate
    name: python
  path: sandbox-patch.yaml
