apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentbox-api-budget
  namespace: agentbox-work
  labels:
    agentbox.dev/session: development
    agentbox.dev/session-run: preview
spec:
  hard:
    pods: '3'
    requests.cpu: 300m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 1536Mi
    count/sandboxclaims.extensions.agents.x-k8s.io: '32'
