apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: calico-node
spec:
  template:
    spec:
      containers:
      - name: calico-node
        env:
        - name: CALICO_IPV4POOL_CIDR
          value: 10.244.0.0/16
        - name: CALICO_IPV4POOL_IPIP
          value: Never
        - name: CALICO_IPV4POOL_VXLAN
          value: Always
        - name: FELIX_IPV6SUPPORT
          value: 'false'
        - name: FELIX_BPFENABLED
          value: 'false'
        - name: CLUSTER_TYPE
          value: k8s
