- op: add
  path: /spec/template/spec/nodeSelector
  value:
    kubernetes.io/hostname: agentbox-platform-lab-control-plane
- op: add
  path: /spec/template/spec/tolerations
  value:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
- op: add
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: Never
- op: add
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
- op: add
  path: /spec/template/spec/containers/0/readinessProbe
  value:
    httpGet:
      path: /readyz
      port: 8081
    periodSeconds: 2
    failureThreshold: 60
