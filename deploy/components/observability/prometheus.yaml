global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/rules.yaml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets: ['127.0.0.1:19090']
    labels:
      instance: prometheus
- job_name: host
  static_configs:
  - targets: ['127.0.0.1:19100']
    labels:
      instance: physical-host
- job_name: observer
  static_configs:
  - targets: ['127.0.0.1:19101']
    labels:
      instance: namespace-observer
- job_name: agentbox-api
  file_sd_configs:
  - files: [/etc/prometheus/targets.yaml]
    refresh_interval: 2s
  sample_limit: 10000
