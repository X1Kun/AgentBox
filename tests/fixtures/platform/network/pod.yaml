apiVersion: v1
kind: Pod
metadata:
  name: agentbox-probe
  namespace: agentbox-platform
  labels:
    agentbox.dev/session: development
    agentbox.dev/net-run: preview
    agentbox.dev/net-role: sandbox
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: compute
    image: agentbox/probe:local
    imagePullPolicy: IfNotPresent
    command: []
    env:
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: NET_RUN
      value: preview
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    readinessProbe:
      httpGet:
        path: /
        port: 8000
      initialDelaySeconds: 1
      periodSeconds: 2
    volumeMounts:
    - name: work
      mountPath: /work
    - name: work
      mountPath: /tmp
  volumes:
  - name: work
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
